<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de tabelas</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <table>
        <colgroup>
            <col style="background-color: #f2f2f2;">
            <col style="background-color: #e6f7ff;" span="2">
            <col style="background-color: #f9f2ff;">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Daniel Moreira</td>
            <td>Masculino</td>
            <td>34</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Noé Moreira</td>
            <td>Masculino</td>
            <td>12</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>João Silva</td>
            <td>Masculino</td>
            <td>28</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Maria Oliveira</td>
            <td>Feminino</td>
            <td>34</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td>Carlos Souza</td>
            <td>Masculino</td>
            <td>22</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>Ana Pereira</td>
            <td>Feminino</td>
            <td>29</td>
            <td>Designer</td>
        </tr>
    </table>
</body>
</html>
